<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>教室環境モニター</title>

  <style>

    body {
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      margin: 20px;
      font-size: 18px;
    }

    #saveStatus {
      margin: 15px;
      font-size: 16px;
      color: #555;
    }

    button {
      font-size: 15px;
      padding: 8px 18px;
      margin: 8px;
      cursor: pointer;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 20px;
      width: min(760px, 100%);
      margin: 20px auto 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      min-height: 180px;
    }

    @media (max-width: 560px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .title {
      font-size: 20px;
    }

    .value {
      font-size: 42px;
      font-weight: bold;
      margin-top: 10px;
    }

    #updated {
      margin-top: 25px;
      color: #555;
    }

    .connected {
      color: green;
      font-weight: bold;
    }

    .disconnected {
      color: #555;
    }

    .error {
      color: red;
    }

    .test-area {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
    }

    .test-title {
      font-size: 14px;
      color: #777;
    }

    .wbgt-risk,
    .co2-risk {
      margin-top: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .wbgt-note {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    /* ★追加：更新停止の警告表示 */
    .stale-warning {
      margin-top: 10px;
      padding: 10px;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffe08a;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

  </style>

</head>


<body>


  <!-- ========================================
       タイトル
  ========================================= -->

  <h1>
    教室環境モニター
  </h1>


  <!-- ========================================
       BLE接続状態
  ========================================= -->

  <div
    id="status"
    class="disconnected"
  >
    BLEセンサー未接続
  </div>


  <!-- ========================================
       BLE接続ボタン
  ========================================= -->

  <button
    id="connectButton"
    onclick="connectBLE()"
  >
    センサーに接続
  </button>


  <!-- ========================================
       センサー表示
  ========================================= -->

  <div class="container">


    <!-- CO2 -->

    <div class="card">

      <div class="title">
        CO₂
      </div>

      <div class="value">

        <span id="co2">
          ---
        </span>

      </div>

      <div>
        ppm
      </div>

      <div
        id="co2Risk"
        class="co2-risk"
      >
        ---
      </div>

    </div>


    <!-- 温度 -->

    <div class="card">

      <div class="title">
        温度
      </div>

      <div class="value">

        <span id="temperature">
          ---
        </span>

      </div>

      <div>
        ℃
      </div>

    </div>


    <!-- 湿度 -->

    <div class="card">

      <div class="title">
        湿度
      </div>

      <div class="value">

        <span id="humidity">
          ---
        </span>

      </div>

      <div>
        %
      </div>

    </div>


    <!-- 推定WBGT -->

    <div class="card">

      <div class="title">
        推定WBGT
      </div>

      <div class="value">

        <span id="wbgt">
          ---
        </span>

      </div>

      <div>
        ℃
      </div>

      <div
        id="wbgtRisk"
        class="wbgt-risk"
      >
        ---
      </div>

      <div class="wbgt-note">
        温度・湿度から算出した参考値です
      </div>

    </div>


  </div>


  <!-- ========================================
       最終更新
  ========================================= -->

  <div id="updated">
    最終更新：---
  </div>


  <!-- ========================================
       ★追加：更新停止の警告
       （普段は空。更新が止まったときだけ表示）
  ========================================= -->

  <div id="staleWarning"></div>


  <!-- ========================================
       スプレッドシート保存状態
  ========================================= -->

  <div id="saveStatus">
    スプレッドシート保存：待機中
  </div>


  <!-- ========================================
       テスト送信
  ========================================= -->

  <div class="test-area">

    <div class="test-title">
      通信テスト
    </div>

    <button onclick="testSend()">
      テスト送信
    </button>

  </div>



<script>


// ==================================================
// Apps Script WebアプリURL
// ==================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/fukui-ed.jp/s/AKfycbxreLRigRk-XWqo2ivQbmjmnhjVSS7V2Iuz8W1HSI9owCBF2Pea4Ps5Rmhy5-3U6GkcbA/exec";



// ==================================================
// 教室・センサー情報
// 現在は動作確認用
// ==================================================

const CLASSROOM_ID =
  "TEST";

const SENSOR_ID =
  "AirSensor-Test01";



// ==================================================
// BLE UUID
// ==================================================

const SERVICE_UUID =
  "12345678-1234-1234-1234-123456789000";

const CO2_UUID =
  "12345678-1234-1234-1234-123456789001";

const TEMPERATURE_UUID =
  "12345678-1234-1234-1234-123456789002";

const HUMIDITY_UUID =
  "12345678-1234-1234-1234-123456789003";

// ★追加：時刻同期用（Chromebook -> ESP32 WRITE専用）
const TIME_SYNC_UUID =
  "12345678-1234-1234-1234-123456789004";



// ==================================================
// 最新のセンサー値
// ==================================================

let currentCO2 =
  null;

let currentCO2Risk =
  "";

let currentTemperature =
  null;

let currentHumidity =
  null;

let currentWBGT =
  null;

let currentWBGTRisk =
  "";

let bleDevice =
  null;

// ★追加：最後にBLE通知を受け取った時刻（更新停止の監視用）
let lastNotificationTime =
  null;

// ★追加：この秒数より長く通知が来なければ「更新停止」とみなす
const STALE_THRESHOLD_MS =
  30 * 1000;



// ==================================================
// BLE接続
// ==================================================

async function connectBLE() {


  const status =
    document.getElementById(
      "status"
    );


  const button =
    document.getElementById(
      "connectButton"
    );


  try {


    // ----------------------------------------------
    // Web Bluetooth対応確認
    // ----------------------------------------------

    if (!navigator.bluetooth) {


      status.textContent =
        "このブラウザではWeb Bluetoothが利用できません。";


      status.className =
        "error";


      return;

    }



    status.textContent =
      "センサーを検索しています...";


    status.className =
      "disconnected";



    // ----------------------------------------------
    // BLE機器検索
    // Service UUIDでESP32を検索
    // ----------------------------------------------

    bleDevice =
      await navigator.bluetooth.requestDevice({


        filters: [

          {

            services: [

              SERVICE_UUID

            ]

          }

        ]


      });



    status.textContent =
      "ESP32へ接続しています...";



    // ----------------------------------------------
    // GATT接続
    // ----------------------------------------------

    const server =
      await bleDevice.gatt.connect();



    // ----------------------------------------------
    // Service取得
    // ----------------------------------------------

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );



    // ==================================================
    // ★追加：時刻同期（Chromebook -> ESP32）
    //
    // 接続直後にUnix Epoch秒をESP32へ送る。
    // 失敗してもCO2/温度/湿度の受信は継続させたいため、
    // ここだけ個別にtry/catchする。
    // ==================================================

    try {

      const timeSyncCharacteristic =
        await service.getCharacteristic(
          TIME_SYNC_UUID
        );

      const epoch =
        Math.floor(
          Date.now() / 1000
        );

      const encoder =
        new TextEncoder();

      const epochBytes =
        encoder.encode(
          String(epoch)
        );

      // Chrome/ChromeOSのバージョンにより
      // writeValueWithResponseが無い場合があるため、
      // 使えるほうを使う
      if (timeSyncCharacteristic.writeValueWithResponse) {

        await timeSyncCharacteristic
          .writeValueWithResponse(
            epochBytes
          );

      } else {

        await timeSyncCharacteristic
          .writeValue(
            epochBytes
          );

      }

      console.log(
        "時刻同期を送信しました。Epoch: " +
        epoch
      );

    }

    catch (timeSyncError) {

      // 時刻同期に失敗しても致命的ではないため、
      // ログにだけ残して処理を続ける
      console.error(
        "時刻同期エラー：",
        timeSyncError
      );

    }



    // ==================================================
    // CO2
    // ==================================================

    const co2Characteristic =
      await service.getCharacteristic(
        CO2_UUID
      );


    await co2Characteristic
      .startNotifications();



    co2Characteristic.addEventListener(

      "characteristicvaluechanged",

      event => {


        const value =
          readText(
            event
          );


        currentCO2 =
          Number(
            value
          );


        document
          .getElementById(
            "co2"
          )
          .textContent =
          value;


        updateCO2Risk();

        updateWBGT();

        updateTime();


      }

    );



    // ==================================================
    // 温度
    // ==================================================

    const temperatureCharacteristic =
      await service.getCharacteristic(
        TEMPERATURE_UUID
      );


    await temperatureCharacteristic
      .startNotifications();



    temperatureCharacteristic.addEventListener(

      "characteristicvaluechanged",

      event => {


        const value =
          readText(
            event
          );


        currentTemperature =
          Number(
            value
          );


        document
          .getElementById(
            "temperature"
          )
          .textContent =
          value;


        updateWBGT();

        updateTime();


      }

    );



    // ==================================================
    // 湿度
    // ==================================================

    const humidityCharacteristic =
      await service.getCharacteristic(
        HUMIDITY_UUID
      );


    await humidityCharacteristic
      .startNotifications();



    humidityCharacteristic.addEventListener(

      "characteristicvaluechanged",

      event => {


        const value =
          readText(
            event
          );


        currentHumidity =
          Number(
            value
          );


        document
          .getElementById(
            "humidity"
          )
          .textContent =
          value;


        updateWBGT();

        updateTime();


      }

    );



    // ==================================================
    // 接続完了
    // ==================================================

    status.textContent =
      "● センサー接続済み";


    status.className =
      "connected";


    button.textContent =
      "接続済み";



    // ----------------------------------------------
    // 切断検知
    // ----------------------------------------------

    bleDevice.addEventListener(

      "gattserverdisconnected",

      onDisconnected

    );


  }


  catch (error) {


    console.error(
      error
    );


    status.textContent =
      "接続エラー：" +
      error.message;


    status.className =
      "error";


  }


}



// ==================================================
// BLEデータを文字列へ変換
// ==================================================

function readText(event) {


  return new TextDecoder()
    .decode(
      event.target.value
    );

}



// ==================================================
// CO2濃度の判定
// ==================================================

function updateCO2Risk() {

  if (currentCO2 === null) {
    return;
  }


  let risk = "";


  if (currentCO2 < 1000) {

    risk =
      "良好";

  }
  else if (currentCO2 < 1500) {

    risk =
      "換気推奨";

  }
  else if (currentCO2 < 2000) {

    risk =
      "換気必要";

  }
  else {

    risk =
      "要注意";

  }


  currentCO2Risk =
    risk;


  document
    .getElementById(
      "co2Risk"
    )
    .textContent =
    risk;

}



// ==================================================
// 推定WBGT計算
//
// 温度 T[℃] と相対湿度 RH[%] から算出する近似値。
// 黒球温度を使用しないため、正式なWBGT測定値ではなく
// 教室内の暑熱環境を把握するための参考値として扱う。
// ==================================================

function updateWBGT() {

  if (
    currentTemperature === null ||
    currentHumidity === null
  ) {

    return;

  }


  const T =
    currentTemperature;

  const RH =
    currentHumidity;


  const wbgt =
    0.735 * T +
    0.0374 * RH +
    0.00292 * T * RH -
    4.064;


  currentWBGT =
    Math.round(wbgt * 10) / 10;


  let risk = "";


  if (currentWBGT < 21) {

    risk =
      "ほぼ安全";

  }
  else if (currentWBGT < 25) {

    risk =
      "注意";

  }
  else if (currentWBGT < 28) {

    risk =
      "警戒";

  }
  else if (currentWBGT < 31) {

    risk =
      "厳重警戒";

  }
  else {

    risk =
      "運動は原則中止";

  }


  currentWBGTRisk =
    risk;


  document
    .getElementById(
      "wbgt"
    )
    .textContent =
    currentWBGT.toFixed(1);


  document
    .getElementById(
      "wbgtRisk"
    )
    .textContent =
    risk;

}



// ==================================================
// BLEデータ更新時刻
// ==================================================

function updateTime() {


  // ★追加：通知を受け取った時刻を記録（更新停止の監視用）
  lastNotificationTime =
    Date.now();


  const now =
    new Date();


  document
    .getElementById(
      "updated"
    )
    .textContent =

      "最終更新：" +

      now.toLocaleTimeString(
        "ja-JP"
      );


}



// ==================================================
// ★追加：更新停止の監視
//
// CO2/温度/湿度のBLE通知は約5秒ごとに来るはずなので、
// STALE_THRESHOLD_MS（既定30秒）より長く来ていなければ
// 「見た目は接続中でも、実際は更新が止まっている」
// 状態として警告を表示する。
//
// 過去に、ESP32を再起動しても直らず、Chromebookページの
// 再読み込み・再接続で直った不具合があったため、その
// パターンを早めに気づけるようにするための機能。
// ==================================================

function checkStaleData() {

  const warningEl =
    document.getElementById(
      "staleWarning"
    );

  if (!warningEl) {
    return;
  }


  // まだ一度も通知を受け取っていない場合は何もしない
  if (lastNotificationTime === null) {

    warningEl.textContent =
      "";

    warningEl.className =
      "";

    return;
  }


  const elapsedMs =
    Date.now() -
    lastNotificationTime;


  if (elapsedMs > STALE_THRESHOLD_MS) {

    const elapsedSec =
      Math.floor(
        elapsedMs / 1000
      );

    warningEl.textContent =
      "⚠ センサーからの更新が" +
      elapsedSec +
      "秒止まっています。表示が古い可能性があります。" +
      "改善しない場合は、ページの再読み込み・再接続をお試しください。";

    warningEl.className =
      "stale-warning";

  } else {

    warningEl.textContent =
      "";

    warningEl.className =
      "";

  }

}


// 5秒ごとに更新停止をチェック
setInterval(
  checkStaleData,
  5000
);



// ==================================================
// BLE切断時
// ==================================================

function onDisconnected() {


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "センサーとの接続が切れました";


  status.className =
    "error";


  document
    .getElementById(
      "connectButton"
    )
    .textContent =
    "再接続";


  // ★追加：切断が分かっているときは
  // 更新停止の警告は表示しない（二重表示を避けるため）
  lastNotificationTime =
    null;

  const warningEl =
    document.getElementById(
      "staleWarning"
    );

  if (warningEl) {

    warningEl.textContent =
      "";

    warningEl.className =
      "";

  }


}



// ==================================================
// テスト送信
//
// 固定値
// CO2：500
// 温度：25.0
// 湿度：50.0
//
// をApps Scriptへ送信
// ==================================================

async function testSend() {


  const saveStatus =
    document.getElementById(
      "saveStatus"
    );


  const testData = {


    classroomId:
      "TEST",


    sensorId:
      "AirSensor-Test01",


    co2:
      500,


    co2Risk:
      "良好",


    temperature:
      25.0,


    humidity:
      50.0,


    wbgt:
      21.6,


    wbgtRisk:
      "注意"


  };


  try {


    saveStatus.textContent =
      "テストデータ送信中...";



    await fetch(

      APPS_SCRIPT_URL,

      {


        method:
          "POST",


        mode:
          "no-cors",


        // 学校Googleアカウントの
        // 認証情報を送信
        credentials:
          "include",


        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },


        body:
          JSON.stringify(
            testData
          )


      }

    );



    saveStatus.textContent =
      "テスト送信処理を実行しました";


    alert(
      "テスト送信処理を実行しました"
    );


  }


  catch (error) {


    console.error(
      error
    );


    saveStatus.textContent =
      "送信エラー：" +
      error.message;


    alert(
      "送信エラー：" +
      error.message
    );


  }


}



// ==================================================
// 実際のセンサーデータを
// スプレッドシートへ送信
// ==================================================

async function sendToSpreadsheet() {


  const saveStatus =
    document.getElementById(
      "saveStatus"
    );


  // ----------------------------------------------
  // CO2・温度・湿度の3つが
  // まだ揃っていなければ送信しない
  // ----------------------------------------------

  if (

    currentCO2 === null ||

    currentTemperature === null ||

    currentHumidity === null ||

    currentWBGT === null

  ) {


    saveStatus.textContent =
      "スプレッドシート保存：測定値待機中";


    return;

  }



  // ----------------------------------------------
  // 送信データ作成
  // ----------------------------------------------

  const data = {


    classroomId:
      CLASSROOM_ID,


    sensorId:
      SENSOR_ID,


    co2:
      currentCO2,


    co2Risk:
      currentCO2Risk,


    temperature:
      currentTemperature,


    humidity:
      currentHumidity,


    wbgt:
      currentWBGT,


    wbgtRisk:
      currentWBGTRisk


  };



  try {


    saveStatus.textContent =
      "スプレッドシートへ送信中...";



    await fetch(

      APPS_SCRIPT_URL,

      {


        method:
          "POST",


        mode:
          "no-cors",


        // ==========================================
        // ★重要
        //
        // fukui-ed.jpのApps Scriptへ
        // 認証情報を含めて送信
        // ==========================================

        credentials:
          "include",


        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },


        body:
          JSON.stringify(
            data
          )


      }

    );



    const now =
      new Date();


    saveStatus.textContent =

      "スプレッドシート保存：" +

      now.toLocaleTimeString(
        "ja-JP"
      );


  }


  catch (error) {


    console.error(
      error
    );


    saveStatus.textContent =
      "保存エラー：" +
      error.message;


  }


}



// ==================================================
// 時計の5分区切りに合わせてスプレッドシートへ保存
//
// 例：9:00、9:05、9:10、9:15 ...
// 秒単位ではブラウザや通信状況により多少ずれる場合があります。
// ==================================================

function startScheduledSave() {

  const now =
    new Date();

  const next =
    new Date(now);

  // 秒・ミリ秒を0にする
  next.setSeconds(0);
  next.setMilliseconds(0);

  // 次の5分区切りを求める
  const remainder =
    next.getMinutes() % 5;

  if (
    remainder === 0 &&
    now.getSeconds() === 0 &&
    now.getMilliseconds() === 0
  ) {

    // ちょうど5分区切りならその時刻
    // ただし初期化処理後に実行されるため、次回へ送る
    next.setMinutes(
      next.getMinutes() + 5
    );

  }
  else {

    const addMinutes =
      remainder === 0
        ? 5
        : 5 - remainder;

    next.setMinutes(
      next.getMinutes() + addMinutes
    );

  }


  const waitTime =
    next.getTime() -
    now.getTime();


  console.log(
    "次回保存予定：" +
    next.toLocaleTimeString("ja-JP")
  );


  // 次の5分区切りまで待つ
  setTimeout(
    function scheduledSave() {

      sendToSpreadsheet();

      // setIntervalの累積ずれを避けるため、
      // 毎回次の時計上の5分区切りを再計算する
      startScheduledSave();

    },
    waitTime
  );

}


// 保存スケジュール開始
startScheduledSave();


</script>


</body>
</html>
